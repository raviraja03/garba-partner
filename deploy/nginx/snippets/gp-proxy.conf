# Garba Partner — proxy to the API process (installed to /etc/nginx/snippets/gp-proxy.conf).

proxy_pass http://gp_api;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# The API trusts X-Forwarded-* only from loopback and uses it for rate limits and audit
# hashes. Whatever the client sent is replaced with the address Nginx actually saw.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Sent by Nginx at server level instead (so it is never duplicated).
proxy_hide_header Strict-Transport-Security;

proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
