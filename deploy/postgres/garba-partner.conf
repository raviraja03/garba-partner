# Garba Partner — PostgreSQL 16 server settings for a single-VPS deployment.
# Guide: docs/deployment/production-setup.md §5
#
# Install as /etc/postgresql/16/main/conf.d/garba-partner.conf, then:
#   sudo systemctl restart postgresql
# Sizes assume a 4 GB VPS shared with Nginx and the API; adjust the three marked lines.

# --- Network: never reachable from the internet ---------------------------------------
listen_addresses = 'localhost'
password_encryption = 'scram-sha-256'

# --- Connections ----------------------------------------------------------------------------
# API pool (DATABASE_POOL_MAX=10) + migrations + backups + a psql session, with headroom.
max_connections = 40

# --- Memory (adjust to the server) ----------------------------------------------------------
shared_buffers = 1GB            # ~25% of RAM
effective_cache_size = 2GB      # ~50% of RAM
work_mem = 8MB                  # per sort/hash, per connection
maintenance_work_mem = 128MB

# --- Durability -----------------------------------------------------------------------------
# Keep the safe defaults: fsync=on, synchronous_commit=on, full_page_writes=on.
wal_compression = on
checkpoint_timeout = 15min
max_wal_size = 2GB

# --- Time ------------------------------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'

# --- Logging: operations yes, personal data no ---------------------------------------------
# The API sends values inside the SQL text, so statement logging would write members' data
# (search terms, phone hashes, messages) to the server log. Statements are therefore never
# logged: not on success, not when slow, not on error.
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = panic
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0

log_connections = on
log_disconnections = on
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 10s
log_line_prefix = '%m [%p] %q%u@%d '

# Slow-query analysis without personal data: pg_stat_statements stores normalised queries
# (constants replaced by $1, $2 ...). Optional; needs a restart and, once, as superuser:
#   CREATE EXTENSION pg_stat_statements;
# shared_preload_libraries = 'pg_stat_statements'
